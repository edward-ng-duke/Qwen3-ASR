<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3-ASR 热词离线服务</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#0b1020; color:#e8ecf7; }
    body { margin:0; padding:32px 18px; }
    main { max-width:900px; margin:auto; }
    h1 { font-size:28px; margin:0 0 8px; }
    .hint { color:#9aa7c2; margin-bottom:24px; }
    .card { background:#141b2d; border:1px solid #29324a; border-radius:14px; padding:20px; margin:16px 0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:block; color:#c5cee1; font-size:13px; }
    input, textarea, select { box-sizing:border-box; width:100%; margin-top:6px; padding:10px; color:#eef2ff; background:#0c1221; border:1px solid #34405d; border-radius:8px; }
    textarea { min-height:80px; resize:vertical; }
    button { border:0; border-radius:9px; padding:10px 16px; margin:12px 8px 0 0; background:#5b7cff; color:white; font-weight:650; cursor:pointer; }
    button.secondary { background:#34405d; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    pre { min-height:100px; white-space:pre-wrap; overflow-wrap:anywhere; background:#080d19; border-radius:9px; padding:14px; color:#d8e2ff; }
    .status { color:#7ee2ad; font-size:13px; }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Qwen3-ASR Transformers 热词版</h1>
  <div class="hint">资源完全本地；WebSocket 是实时双向传输，模型端按窗口重解码并区分 confirmed / preview。</div>
  <section class="card">
    <div class="grid">
      <label>API Key（未配置服务端密钥时留空）<input id="apiKey" type="password" autocomplete="off"></label>
      <label>语言
        <select id="language"><option value="auto">自动检测</option><option value="zh">中文</option><option value="en">English</option><option value="yue">粤语</option><option value="ja">日本語</option><option value="ko">한국어</option></select>
      </label>
    </div>
    <label>自由上下文<textarea id="prompt" placeholder="例如：这是一次关于语音识别部署的技术会议。"></textarea></label>
    <label>热词（逗号或换行分隔）<textarea id="hotwords" placeholder="Qwen3-ASR, Transformers, 张三"></textarea></label>
  </section>
  <section class="card">
    <h2>文件识别</h2>
    <input id="audioFile" type="file" accept="audio/*,video/*">
    <button id="offlineBtn">一次性识别</button>
    <button id="sseBtn" class="secondary">SSE 增量识别</button>
  </section>
  <section class="card">
    <h2>麦克风实时识别</h2>
    <button id="startMic">开始</button><button id="stopMic" class="secondary" disabled>结束</button>
    <div id="status" class="status">空闲</div>
  </section>
  <section class="card"><h2>结果</h2><pre id="result"></pre></section>
</main>
<script>
const $ = id => document.getElementById(id);
const result = $('result');
let ws, audioContext, sourceNode, processorNode, mediaStream;
function hotwords() { return $('hotwords').value.split(/[，,\n]/).map(x=>x.trim()).filter(Boolean); }
function authHeaders() { const k=$('apiKey').value; return k ? {Authorization:`Bearer ${k}`} : {}; }
function formData() {
  const file=$('audioFile').files[0]; if(!file) throw new Error('请先选择音频文件');
  const form=new FormData(); form.append('file',file); form.append('language',$('language').value);
  form.append('prompt',$('prompt').value); form.append('hotwords',JSON.stringify(hotwords())); return form;
}
function show(value) { result.textContent = typeof value === 'string' ? value : JSON.stringify(value,null,2); }
$('offlineBtn').onclick=async()=>{ try { show('处理中…'); const r=await fetch('/v1/audio/transcriptions',{method:'POST',headers:authHeaders(),body:formData()}); show(await r.json()); } catch(e){show(String(e));} };
$('sseBtn').onclick=async()=>{ try {
  show('上传并处理中…'); const r=await fetch('/v1/audio/transcriptions/stream',{method:'POST',headers:authHeaders(),body:formData()});
  if(!r.ok){show(await r.text());return;} const reader=r.body.getReader(), decoder=new TextDecoder(); let buffer='', latest='';
  while(true){const {value,done}=await reader.read(); if(done)break; buffer+=decoder.decode(value,{stream:true});
    const blocks=buffer.split('\n\n'); buffer=blocks.pop(); for(const block of blocks){const line=block.split('\n').find(x=>x.startsWith('data: ')); if(line){const event=JSON.parse(line.slice(6)); latest=event.text||latest; show({...event,text:latest});}}
  }
} catch(e){show(String(e));} };
$('startMic').onclick=async()=>{ try {
  mediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
  audioContext=new AudioContext(); sourceNode=audioContext.createMediaStreamSource(mediaStream); processorNode=audioContext.createScriptProcessor(4096,1,1);
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/v1/audio/realtime`); ws.binaryType='arraybuffer';
  ws.onmessage=e=>{const event=JSON.parse(e.data); $('status').textContent=event.type; if(event.type!=='ready'&&event.type!=='pong')show(event); if(event.type==='final')cleanupMic();};
  ws.onerror=()=>{$('status').textContent='连接错误';}; ws.onclose=()=>cleanupMic();
  ws.onopen=()=>{ws.send(JSON.stringify({type:'start',encoding:'pcm_f32le',sample_rate:audioContext.sampleRate,channels:1,language:$('language').value,prompt:$('prompt').value,hotwords:hotwords(),api_key:$('apiKey').value||null}));
    processorNode.onaudioprocess=e=>{if(ws.readyState===WebSocket.OPEN){const pcm=new Float32Array(e.inputBuffer.getChannelData(0));ws.send(pcm.buffer);}};
    sourceNode.connect(processorNode); processorNode.connect(audioContext.destination); $('status').textContent='录音中'; $('startMic').disabled=true; $('stopMic').disabled=false;
  };
} catch(e){show(String(e)); cleanupMic();} };
$('stopMic').onclick=()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'finish'})); if(processorNode)processorNode.onaudioprocess=null; if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop()); $('status').textContent='正在完成…';};
function cleanupMic(){if(processorNode){try{processorNode.disconnect();}catch{}} if(sourceNode){try{sourceNode.disconnect();}catch{}} if(audioContext){audioContext.close();} if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop()); processorNode=sourceNode=audioContext=mediaStream=null; $('startMic').disabled=false; $('stopMic').disabled=true; if($('status').textContent!=='连接错误')$('status').textContent='空闲';}
</script>
</body>
</html>
